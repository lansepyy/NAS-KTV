# Build & push NASKTV Docker images
# backend / separator / downloader / web
#
# GitHub Actions -> GitHub Container Registry (GHCR)
#
# Images:
#   ghcr.io/<OWNER>/nasktv:backend-<semver>
#   ghcr.io/<OWNER>/nasktv:separator-<semver>
#   ghcr.io/<OWNER>/nasktv:downloader-<semver>
#   ghcr.io/<OWNER>/nasktv:web-<semver>
#
# Release 时额外生成：
#   <service>-latest
#
# Platform:
#   linux/amd64
#
# Registry:
#   GitHub Container Registry (GHCR)
#
# 不再需要：
#   ALIYUN_ACR_REGISTRY
#   ALIYUN_ACR_USERNAME
#   ALIYUN_ACR_PASSWORD
#   ALIYUN_ACR_NAMESPACE

name: Build Docker Images


# ==============================================================
# Workflow triggers
# ==============================================================

on:

  # ------------------------------------------------------------
  # Reusable workflow
  # release.yml 可以通过 workflow_call 调用
  # ------------------------------------------------------------

  workflow_call:

    inputs:
      tag:
        type: string
        default: ''
        required: false


  # ------------------------------------------------------------
  # 手动执行
  # ------------------------------------------------------------

  workflow_dispatch:

    inputs:
      tag:
        description: 'Docker image version, e.g. v0.2.3'
        type: string
        default: ''
        required: false


# ==============================================================
# GitHub Actions permissions
#
# packages: write
#   允许向 GHCR 推送 Docker 镜像
# ==============================================================

permissions:
  contents: read
  packages: write


# ==============================================================
# Jobs
# ==============================================================

jobs:

  build:

    name: Build ${{ matrix.name }}

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      matrix:

        include:

          # ----------------------------------------------------
          # Backend
          # ----------------------------------------------------

          - name: backend
            context: .
            dockerfile: packages/backend/Dockerfile


          # ----------------------------------------------------
          # Separator
          # ----------------------------------------------------

          - name: separator
            context: packages/separator
            dockerfile: packages/separator/Dockerfile


          # ----------------------------------------------------
          # Downloader
          # ----------------------------------------------------

          - name: downloader
            context: packages/downloader
            dockerfile: packages/downloader/Dockerfile


          # ----------------------------------------------------
          # Web
          # ----------------------------------------------------

          - name: web
            context: .
            dockerfile: packages/web/Dockerfile


    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # Sync version
      # ========================================================

      - name: Sync version

        shell: bash

        env:
          TAG: ${{ inputs.tag }}

        run: |

          set -e

          # 有 tag：
          #   使用 Release tag 版本
          #
          # 无 tag：
          #   从 manifest 同步版本

          if [ -n "$TAG" ]; then

            node scripts/set-version.mjs "${TAG#v}"

          else

            node scripts/set-version.mjs

          fi


      # ========================================================
      # Setup Docker Buildx
      # ========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ========================================================
      # Login to GitHub Container Registry
      #
      # github.actor：
      #   当前执行 Actions 的 GitHub 用户
      #
      # GITHUB_TOKEN：
      #   GitHub Actions 自动提供
      # ========================================================

      - name: Login to GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================
      # Compute image tags
      # ========================================================

      - name: Compute image tags

        id: tags

        env:

          # ----------------------------------------------------
          # 自动获取仓库 Owner
          #
          # 例如：
          #
          # github.com/lansepyy/nasktv
          #        ↓
          # lansepyy
          #
          # 如果以后变成：
          #
          # github.com/NASKTV/nasktv
          #        ↓
          # NASKTV
          #
          # 不需要修改 workflow
          # ----------------------------------------------------

          OWNER: ${{ github.repository_owner }}


          # ----------------------------------------------------
          # Tag
          # ----------------------------------------------------

          TAG: ${{ inputs.tag || github.ref_name }}


          # ----------------------------------------------------
          # 判断是否为 Release 调用
          # ----------------------------------------------------

          INPUT_TAG: ${{ inputs.tag }}

        shell: bash

        run: |

          set -e


          # ----------------------------------------------------
          # 去掉 v 前缀
          #
          # v0.2.3
          # ↓
          # 0.2.3
          # ----------------------------------------------------

          VER="${TAG#v}"


          # ----------------------------------------------------
          # GHCR 基础镜像地址
          #
          # 自动使用当前仓库 Owner
          # ----------------------------------------------------

          BASE="ghcr.io/${OWNER}/nasktv"


          # ----------------------------------------------------
          # 防止版本为空
          # ----------------------------------------------------

          if [ -z "$VER" ]; then

            echo "ERROR: Docker image version is empty."

            exit 1

          fi


          echo "======================================"
          echo "Docker Registry : ghcr.io"
          echo "Repository Owner : ${OWNER}"
          echo "Image Base       : ${BASE}"
          echo "Version          : ${VER}"
          echo "Service          : ${{ matrix.name }}"
          echo "======================================"


          {

            echo "tags<<EOF"


            # --------------------------------------------------
            # 完整版本
            #
            # backend-0.2.3
            # --------------------------------------------------

            echo "${BASE}:${{ matrix.name }}-${VER}"


            # --------------------------------------------------
            # major.minor
            #
            # backend-0.2
            # --------------------------------------------------

            echo "${BASE}:${{ matrix.name }}-${VER%.*}"


            # --------------------------------------------------
            # Release 才生成 latest
            #
            # backend-latest
            # --------------------------------------------------

            if [ -n "${INPUT_TAG}" ]; then

              echo "${BASE}:${{ matrix.name }}-latest"

            fi


            echo "EOF"

          } >> "$GITHUB_OUTPUT"


      # ========================================================
      # Build & Push
      # ========================================================

      - name: Build and push

        uses: docker/build-push-action@v6

        with:

          # ----------------------------------------------------
          # Docker build context
          # ----------------------------------------------------

          context: ${{ matrix.context }}


          # ----------------------------------------------------
          # Dockerfile
          # ----------------------------------------------------

          file: ${{ matrix.dockerfile }}


          # ----------------------------------------------------
          # 只构建 amd64
          #
          # separator 使用 NVIDIA GPU
          # 因此不构建 arm64
          # ----------------------------------------------------

          platforms: linux/amd64


          # ----------------------------------------------------
          # 构建完成后直接推送 GHCR
          # ----------------------------------------------------

          push: true


          # ----------------------------------------------------
          # 关闭 provenance
          # ----------------------------------------------------

          provenance: false


          # ----------------------------------------------------
          # 关闭 SBOM
          # ----------------------------------------------------

          sbom: false


          # ----------------------------------------------------
          # Web 构建参数
          # ----------------------------------------------------

          build-args: |

            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}


          # ----------------------------------------------------
          # Docker tags
          # ----------------------------------------------------

          tags: ${{ steps.tags.outputs.tags }}


          # ----------------------------------------------------
          # GitHub Actions Docker Layer Cache
          # ----------------------------------------------------

          
