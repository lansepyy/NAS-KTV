# Build & push NASKTV Docker images
#
# GitHub Actions -> GitHub Container Registry (GHCR)
#
# Images:
#   ghcr.io/<OWNER>/nasktv:backend-<semver>
#   ghcr.io/<OWNER>/nasktv:separator-<semver>
#   ghcr.io/<OWNER>/nasktv:downloader-<semver>
#   ghcr.io/<OWNER>/nasktv:web-<semver>
#
# Release 时额外生成：
#   backend-latest
#   separator-latest
#   downloader-latest
#   web-latest
#
# Platform:
#   linux/amd64
#
# 不再需要：
#   ALIYUN_ACR_REGISTRY
#   ALIYUN_ACR_USERNAME
#   ALIYUN_ACR_PASSWORD
#   ALIYUN_ACR_NAMESPACE

name: Build Docker Images

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
        required: false

  workflow_dispatch:
    inputs:
      tag:
        type: string
        default: ''
        required: false

# GitHub Actions 使用 GITHUB_TOKEN 推送 GHCR
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          # Backend
          - name: backend
            context: .
            dockerfile: packages/backend/Dockerfile

          # Separator
          - name: separator
            context: packages/separator
            dockerfile: packages/separator/Dockerfile

          # Downloader
          - name: downloader
            context: packages/downloader
            dockerfile: packages/downloader/Dockerfile

          # Web
          - name: web
            context: .
            dockerfile: packages/web/Dockerfile

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Sync version
      # ============================================================

      - name: Sync version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          # 有 tag：
          #   使用 Release tag 作为版本
          #
          # 无 tag：
          #   从 manifest 同步版本
          #
          if [ -n "$TAG" ]; then
            node scripts/set-version.mjs "${TAG#v}"
          else
            node scripts/set-version.mjs
          fi


      # ============================================================
      # Docker Buildx
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================================
      # Login GitHub Container Registry
      # ============================================================

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # Compute image tags
      # ============================================================

      - name: Compute image tags
        id: tags
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.tag || github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e

          # GitHub Container Registry
          BASE="ghcr.io/${OWNER}/nasktv"

          # 去掉 v 前缀
          VER="${TAG#v}"

          # 防止 workflow_dispatch 没有 tag 时产生非法版本
          if [ -z "$VER" ]; then
            echo "ERROR: Version is empty."
            exit 1
          fi

          echo "Image base: ${BASE}"
          echo "Version: ${VER}"

          {
            echo "tags<<EOF"

            # 完整版本
            # backend-0.2.3
            echo "${BASE}:${{ matrix.name }}-${VER}"

            # major.minor
            # backend-0.2
            echo "${BASE}:${{ matrix.name }}-${VER%.*}"

            # Release 才生成 latest
            if [ -n "${INPUT_TAG}" ]; then
              echo "${BASE}:${{ matrix.name }}-latest"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      # ============================================================
      # Build & Push
      # ============================================================

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}

          # 只构建 amd64
          platforms: linux/amd64

          # 推送到 GHCR
          push: true

          # GHCR 可以正常处理标准 OCI metadata，
          # 但为了保持与你原来的 ACR 配置行为一致，
          # 这里继续关闭 provenance / SBOM。
          provenance: false
          sbom: false

          # Web 构建参数
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}

          # Docker 镜像 tags
          tags: ${{ steps.tags.outputs.tags }}

          # GitHub Actions Docker Layer Cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
